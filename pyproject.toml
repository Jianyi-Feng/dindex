[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dindex"
version = "0.1.0"
description = "Bounded two-group dominance index developed for marine giant-virus communities; D = (P - M)/(P + M), with QC, uncertainty and calibration helpers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "pandas>=1.3", "scipy>=1.7"]
license = {text = "MIT"}
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: R", "Topic :: Scientific/Engineering :: Bio-Informatics"]

[project.optional-dependencies]
calibrate = ["statsmodels>=0.13"]
test = ["pytest>=7", "statsmodels>=0.13"]

[project.scripts]
dindex = "dindex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
